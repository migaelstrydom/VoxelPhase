name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # glslc for build.rs to compile the shaders; the Vulkan loader for ash to link against.
      - name: Install glslc and the Vulkan loader
        run: sudo apt-get update && sudo apt-get install -y glslc libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Release, because some water tests take many minutes unoptimised.
      - name: Test
        run: cargo test --release
