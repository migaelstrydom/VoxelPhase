[package]
name = "rust_dude"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.21"
env_logger = "0.11.3"
ash = { version = "0.38.0", features = ["linked"] }
ash-window = "0.13.0"
raw-window-handle = "0.6.2"
winit = "0.29.15"
specs = { version = "0.20.0", features = ["derive"] }
nalgebra = "0.32"
image = "0.24"
noise = "0.9"        # Procedural noise for terrain generation
smallvec = "1.13"    # Small inline vectors for contact points


[dev-dependencies]
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }