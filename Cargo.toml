[package]
name = "rust_dude"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4"
env_logger = "0.11"
ash = { version = "0.38.0", features = ["linked"] }
ash-window = "0.13.0"
raw-window-handle = "0.6.2"
winit = { version = "0.29", features = ["rwh_06"] }


[dev-dependencies]
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }