[package]
name = "voxel_phase"
version = "0.1.0"
edition = "2021"
default-run = "voxel_phase"
license = "MIT OR Apache-2.0"

# The game is the root package; pure libraries it shares with tools that run
# outside it (in a browser, say) live under crates/. `cargo build`, `run` and
# `test` act on the game unless given `-p` or `--workspace`.
[workspace]
members = [".", "crates/*"]
default-members = ["."]

[dependencies]
traversal_planner = { path = "crates/traversal_planner" }
log = "0.4.21"
env_logger = "0.11.3"
ash = { version = "0.38.0", features = ["linked"] }
ash-window = "0.13.0"
raw-window-handle = "0.6.2"
winit = "0.29.15"
specs = { version = "0.20.0", features = ["derive"] }
rayon = "1.10"
nalgebra = "0.32"
image = "0.24"
noise = "0.9"        # Procedural noise for terrain generation
smallvec = "1.13"    # Small inline vectors for contact points
fontdue = "0.9"      # Font rasterization for debug text overlay
rand = "0.8"         # Random number generation for particles
generational-arena = "0.2"  # Handle-based storage for physics objects
rustc-hash = "2.1.1"
ron = "0.8"                  # Rusty Object Notation for level files
serde = { version = "1", features = ["derive"] }

# Scenario test suites, one per area: whole scenes simulated for seconds,
# which `cargo test` leaves out. Unit tests always run.
[features]
default = []
physics_scenarios = []
water_scenarios = []
rubble_scenarios = []
level_scenarios = []


[dev-dependencies]
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }



# Debug builds run the physics far too slowly to test or play: basic
# optimisation for this crate (the generic maths it instantiates is compiled
# here), full optimisation for dependencies, which are compiled once and cached.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# A build to share or ship: `cargo build --profile dist`, output in target/dist/.
# Fat LTO took the contact solver 13% faster on a crate stack but tripled the
# rebuild after a one-file edit, so everyday --release builds go without it.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
